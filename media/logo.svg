<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A file going down into the column that will hold it.

       The card is the form, the arrow is the drop, and the open tray is the
       zone it lands in. It is the download glyph turned around: the tray is
       what makes the direction "into this column" rather than "onto my disk".

       The ramp is the PCFHub mark's own, verbatim, so this sits in the family rather
       than beside it. Declared in userSpaceOnUse and spanning the whole 96
       canvas, so the mark reads as one object lit from the top right.

       Drawn for 32px. The tray is an open stroke rather than a filled shelf so
       that the arrow can end inside it without the two merging into a single
       blob at 24.

       Note: no double hyphen may appear in this comment, or the whole document
       fails to parse as XML. -->
  <defs>
    <linearGradient id="file-drop-ramp" x1="6" y1="82" x2="90" y2="14" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A684FF"/><stop offset="0.6" stop-color="#7C86FF"/><stop offset="1" stop-color="#00BCFF"/>
    </linearGradient>
  </defs>
  <!-- The form. -->
  <rect x="6" y="10" width="84" height="76" rx="18" fill="url(#file-drop-ramp)"/>

  <!-- The file, dropping. -->
  <path d="M48 24 V52" stroke="#F8FAFC" stroke-width="9" stroke-linecap="round"/>
  <path d="M36 42 L48 54 L60 42" stroke="#F8FAFC" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- The zone it lands in. -->
  <path d="M27 62 V70 H69 V62" stroke="#F8FAFC" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
